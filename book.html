<!doctype html>

<style>
  :root {
    --bg: #EEF3EA; --kad: #FFFFFF; --teks: #1C2620; --kelabu: #5F6C63; --pudar: #8C978F; --garis: #DCE3D8; --trek: #E8EDE5;
    --daun: #2F5D3A; --daun-pucat: #E4EEDD; --hijau-muda: #F3F8EF; --dewan: #4E9A34; --homestay: #2F8BD3;
    --merah: #B0412F; --merah-pucat: #FBEDEA; --kuning-pucat: #FBF3DF; --kuning: #7A5A0E; --biru-pucat: #E3F0FB; --wa: #1FA855;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--teks); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  a { color: var(--daun); }
  :focus-visible { outline: 2px solid var(--daun); outline-offset: 2px; }
  .tersorok { display: none !important; }
  .wrap { position: relative; max-width: 520px; margin: 0 auto; padding: 0 16px calc(110px + env(safe-area-inset-bottom)); overflow-x: clip; }
  .bulatan { position: absolute; top: -90px; right: -80px; width: 240px; height: 240px; border-radius: 50%; background: #CFE6F6; pointer-events: none; }
  header { position: relative; display: flex; align-items: center; gap: 12px; padding: 16px 0 6px; }
  header img { height: 56px; width: auto; mix-blend-mode: multiply; }
  header .nama { flex: 1; min-width: 0; }
  header h1 { font-size: 18px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
  header p { font-size: 12.5px; color: var(--kelabu); }
  .bahasa { flex-shrink: 0; display: flex; background: var(--kad); border-radius: 999px; padding: 3px; box-shadow: 0 6px 16px -10px rgba(28,38,32,.4); }
  .bahasa button { padding: 6px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 800; color: var(--kelabu); }
  .bahasa button[aria-pressed="true"] { background: var(--daun); color: #fff; }

  .langkah-atas { margin-top: 10px; }
  .langkah-atas small { font-size: 12.5px; font-weight: 700; color: var(--kelabu); }
  .bar-langkah { display: flex; gap: 6px; margin-top: 6px; }
  .bar-langkah span { flex: 1; height: 5px; border-radius: 5px; background: var(--garis); }
  .bar-langkah span.on { background: var(--daun); }
  h2.tajuk { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; margin-top: 14px; }
  p.sub { font-size: 14px; color: var(--kelabu); margin-top: 4px; }
  .kad { background: var(--kad); border-radius: 22px; padding: 16px; box-shadow: 0 10px 30px -18px rgba(28,38,32,.38); margin-top: 14px; }
  .kad h3 { font-size: 15px; font-weight: 800; margin-bottom: 6px; }

  h3.sek { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; margin: 22px 2px 10px; }
  h3.sek .no { width: 26px; height: 26px; border-radius: 50%; background: var(--daun); color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .jenis-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .jenis-2 button { display: block; text-align: left; padding: 14px; border-radius: 20px; background: var(--kad); border: 2px solid var(--trek); box-shadow: 0 10px 30px -20px rgba(28,38,32,.4); }
  .jenis-2 button[aria-pressed="true"] { border-color: var(--daun); background: var(--hijau-muda); box-shadow: 0 0 0 3px var(--daun-pucat); }
  .jenis-2 .ikon { width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; color: #fff; }
  .jenis-2 b { display: block; font-size: 17px; margin-top: 10px; }
  .jenis-2 small { display: block; font-size: 12.5px; color: var(--kelabu); line-height: 1.35; }
  .jenis-2 .harga { display: block; margin-top: 8px; font-size: 16px; font-weight: 800; color: var(--daun); }
  .jenis-2 .harga i { font-style: normal; font-size: 12px; font-weight: 600; color: var(--kelabu); }
  .dua { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .dua .medan, .dua .medan:first-child { margin-top: 14px; }
  .jenis { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .jenis button { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px; border-radius: 22px; background: var(--kad); border: 2px solid var(--trek); box-shadow: 0 10px 30px -20px rgba(28,38,32,.4); }
  .jenis button[aria-pressed="true"] { border-color: var(--daun); background: var(--hijau-muda); }
  .jenis .ikon { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
  .jenis .isi { flex: 1; min-width: 0; }
  .jenis b { display: block; font-size: 18px; }
  .jenis small { display: block; font-size: 13px; color: var(--kelabu); }
  .jenis .harga { display: block; margin-top: 4px; font-size: 16px; font-weight: 800; color: var(--daun); }
  .jenis .harga i { font-style: normal; font-size: 12.5px; font-weight: 600; color: var(--kelabu); }

  .nav-bulan { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .nav-bulan b { font-size: 17px; font-weight: 800; }
  .btn-nav { width: 40px; height: 40px; border-radius: 12px; background: var(--daun-pucat); color: var(--daun); display: flex; align-items: center; justify-content: center; }
  .btn-nav:disabled { opacity: .35; }
  .minggu, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .minggu div { text-align: center; font-size: 11px; font-weight: 700; color: var(--pudar); padding-bottom: 6px; }
  .hari { height: 46px; border-radius: 12px; font-weight: 700; font-size: 14.5px; display: flex; align-items: center; justify-content: center; position: relative; }
  .hari:not(:disabled):hover { background: var(--hijau-muda); }
  .hari.sibuk { color: #B9C2BC; text-decoration: line-through; background: repeating-linear-gradient(135deg, #F3F4F2 0 4px, #FAFAF9 4px 8px); cursor: not-allowed; }
  .hari.lepas { color: #C9D0CB; cursor: not-allowed; }
  .hari.dalam { background: var(--daun-pucat); border-radius: 0; color: var(--daun); }
  .hari.mula, .hari.tamat { background: var(--daun); color: #fff; }
  .hari.mula { border-radius: 12px 0 0 12px; }
  .hari.tamat { border-radius: 0 12px 12px 0; }
  .hari.mula.tamat { border-radius: 12px; }
  .hari.kini::after { content: ''; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  .petunjuk { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--kelabu); margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--trek); }
  .petunjuk span { display: flex; align-items: center; gap: 6px; }
  .petunjuk i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .arahan { font-size: 14px; padding: 12px 14px; border-radius: 14px; background: var(--kad); color: var(--kelabu); margin-top: 12px; box-shadow: 0 10px 30px -22px rgba(28,38,32,.4); }
  .arahan.ok { background: var(--daun-pucat); color: var(--daun); }

  .rb { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px; }
  .rb + .rb { border-top: 1px dashed var(--trek); }
  .rb span { color: var(--kelabu); }
  .rb small { display: block; font-size: 12px; color: var(--pudar); }
  .rb b { text-align: right; }
  .rb.besar b { font-size: 18px; }
  .jumlah { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; padding-top: 10px; border-top: 2px solid var(--daun); }
  .jumlah span { font-weight: 800; }
  .jumlah b { font-size: 22px; font-weight: 800; color: var(--daun); }

  .medan { margin-top: 14px; }
  .medan:first-child { margin-top: 0; }
  .medan label { display: block; font-size: 13.5px; font-weight: 700; color: var(--kelabu); margin-bottom: 6px; }
  .medan input, .medan textarea { display: block; width: 100%; border: 1.5px solid var(--garis); border-radius: 14px; padding: 13px; font-size: 16px; background: var(--kad); }
  .medan textarea { resize: vertical; min-height: 84px; }
  .medan input:focus, .medan textarea:focus { outline: none; border-color: var(--daun); box-shadow: 0 0 0 3px var(--daun-pucat); }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .seterus { margin-top: 6px; display: flex; flex-direction: column; gap: 10px; }
  .seterus div { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }
  .seterus .no { width: 26px; height: 26px; border-radius: 50%; background: var(--daun-pucat); color: var(--daun); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .nota { font-size: 12.5px; color: var(--kelabu); line-height: 1.55; margin-top: 12px; }
  .nota b { color: var(--teks); }

  .kaki { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--kad); border-top: 1px solid var(--trek); padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); }
  .kaki-dalam { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .kaki .ringkas { flex: 1; min-width: 0; font-size: 12.5px; color: var(--kelabu); line-height: 1.35; }
  .kaki .ringkas b { display: block; font-size: 17px; color: var(--teks); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px 20px; border-radius: 16px; font-weight: 800; font-size: 15.5px; text-decoration: none; transition: transform .1s, opacity .15s; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; pointer-events: none; }
  .btn-utama { background: var(--daun); color: #fff; }
  .btn-balik { width: 50px; height: 50px; border-radius: 16px; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .btn-wa { background: var(--wa); color: #fff; width: 100%; }
  .btn-garis { background: var(--kad); border: 1.5px solid var(--garis); width: 100%; }
  .btn-kecil { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; background: var(--daun-pucat); color: var(--daun); font-size: 13px; font-weight: 800; }
  .ralat { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--merah-pucat); color: var(--merah); font-size: 14px; font-weight: 600; }
  .pusing { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; animation: pusing .8s linear infinite; }
  .pusing.besar { width: 32px; height: 32px; border-color: var(--trek); border-top-color: var(--daun); margin: 0 auto 12px; }
  .pusing.gelap { border-color: var(--trek); border-top-color: var(--daun); }
  @keyframes pusing { to { transform: rotate(360deg); } }
  .tengah { text-align: center; padding: 60px 12px; color: var(--kelabu); }
  .tengah h2 { color: var(--teks); font-size: 21px; margin-bottom: 6px; }

  /* status page */
  .hero { position: relative; margin-top: 12px; padding: 18px; border-radius: 24px; color: #fff; overflow: hidden; background: var(--daun); }
  .hero::before { content: ''; position: absolute; right: -40px; top: -50px; width: 160px; height: 160px; border-radius: 50%; background: #3F7FB0; opacity: .5; }
  .hero > * { position: relative; }
  .hero.kuning { background: #8A6512; }
  .hero.biru { background: #2B6E9E; }
  .hero.merah { background: #8E3A2B; }
  .hero.kelabu { background: #56615A; }
  .hero small { font-size: 12.5px; opacity: .85; font-weight: 700; }
  .hero h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; margin-top: 4px; }
  .hero p { font-size: 14px; opacity: .92; margin-top: 6px; }
  .garis-masa { display: flex; flex-direction: column; gap: 0; margin-top: 4px; }
  .garis-masa div { display: flex; gap: 12px; align-items: flex-start; position: relative; padding-bottom: 14px; font-size: 14px; }
  .garis-masa div:last-child { padding-bottom: 0; }
  .garis-masa div:not(:last-child)::before { content: ''; position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; background: var(--trek); }
  .garis-masa div.siap:not(:last-child)::before { background: var(--daun); }
  .garis-masa i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--garis); background: var(--kad); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-style: normal; }
  .garis-masa .siap i { background: var(--daun); border-color: var(--daun); }
  .garis-masa .kini i { border-color: var(--daun); box-shadow: 0 0 0 4px var(--daun-pucat); }
  .garis-masa b { display: block; }
  .garis-masa small { display: block; font-size: 12.5px; color: var(--kelabu); }
  .garis-masa .belum b { color: var(--pudar); font-weight: 600; }
  .bayar-kotak { margin-top: 12px; padding: 14px; border-radius: 16px; background: var(--kuning-pucat); }
  .bayar-kotak .amaun { font-size: 26px; font-weight: 800; color: var(--kuning); letter-spacing: -.02em; }
  .bank { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: #fff; font-size: 14px; font-weight: 700; }
  .muat-naik { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; border: 2px dashed #A9D3F0; background: #F2F8FD; text-align: left; cursor: pointer; margin-top: 12px; }
  .muat-naik .ikon { width: 46px; height: 46px; border-radius: 14px; background: var(--homestay); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .muat-naik b { display: block; font-size: 14.5px; }
  .muat-naik small { display: block; font-size: 12.5px; color: var(--kelabu); }
  .lencana { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--daun-pucat); color: var(--daun); font-size: 14px; }
  .dok { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 0; }
  .dok + .dok { border-top: 1px solid var(--trek); }
  .dok .pdf { width: 36px; height: 44px; border-radius: 8px; background: var(--daun-pucat); color: var(--daun); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .dok .isi { flex: 1; min-width: 0; }
  .dok b { display: block; font-size: 14.5px; }
  .dok small { display: block; font-size: 12.5px; color: var(--kelabu); }
  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 40; background: var(--teks); color: #fff; font-size: 14px; font-weight: 600; padding: 11px 16px; border-radius: 14px; display: none; max-width: calc(100% - 32px); text-align: center; }
  @media (prefers-reduced-motion: reduce) { .pusing { animation-duration: 2s; } }
</style>
</head>

    $('tajukBulan').textContent = BULAN[BH][m] + ' ' + y;
    $('btnSebelum').disabled = y === awal.getFullYear() && m === awal.getMonth();
    $('btnSelepas').disabled = new Date(y, m + 1, 1) > addDays(awal, 540);
    let html = '';
    for (let i = 0; i < new Date(y, m, 1).getDay(); i++) html += '<div></div>';
    const akhir = S.tamat || S.mula;
    for (let d = 1; d <= new Date(y, m + 1, 0).getDate(); d++) {
      const k = key(new Date(y, m, d)), kelas = ['hari'], lepas = k < k0, sibuk = S.sibuk[k];
      if (lepas) kelas.push('lepas'); else if (sibuk) kelas.push('sibuk');
      if (k === k0) kelas.push('kini');
      if (S.mula && k >= S.mula && k <= akhir) kelas.push(k === S.mula ? 'mula' : '', k === akhir ? 'tamat' : '', k !== S.mula && k !== akhir ? 'dalam' : '');
      html += '<button class="' + kelas.filter(Boolean).join(' ') + '"' + (lepas || sibuk ? ' disabled' : '') + ' onclick="pilihHari(\'' + k + '\')" aria-label="' + tHari(k) + '">' + d + '</button>';
    }
    $('grid').innerHTML = html;
    const ar = $('arahan'), home = S.jenis === 'Homestay';
    if (!S.mula) { ar.className = 'arahan'; ar.textContent = S.jenis ? t(home ? 'sTarikhHome' : 'sTarikhDewan') : t('sTarikhUmum'); }
    else if (!S.tamat) { ar.className = 'arahan'; ar.textContent = t('pilihKeluar', tHari(S.mula)); }
    else { ar.className = 'arahan ok'; ar.innerHTML = '<b>' + julat(S.mula, S.tamat) + '</b>' + (S.jenis ? ' · ' + t('unit', S.jenis, kiraUnit(S.jenis, S.mula, S.tamat)) : '') + '<br>' + t('kosong') + '. ' + t('ubahTarikh'); }
    ar.style.background = ar.className === 'arahan ok' ? '' : 'var(--bg)';
  }
  function bebas(m, k) { for (let d = parse(m); d <= parse(k); d = addDays(d, 1)) if (S.sibuk[key(d)]) return false; return true; }
  function pilihHari(k) {
    const home = S.jenis === 'Homestay';
    if (!S.mula || (S.tamat && S.tamat !== S.mula) || k < S.mula || (home && S.tamat)) { S.mula = k; S.tamat = home ? '' : k; }
    else if (home && k === S.mula) { S.mula = ''; S.tamat = ''; }
    else if (bebas(S.mula, k)) S.tamat = k;
    else { S.mula = k; S.tamat = home ? '' : k; }
    lukisKalendar(); kemaskini();
    $('ralat').classList.add('tersorok');
  }

  function simpanMedan() {
    if (!$('fNama')) return;
    S.f = { nama: $('fNama').value, telefon: $('fTel').value, pax: $('fPax').value, email: $('fEmel').value, catatan: $('fCatatan').value, web: $('fWeb').value };
  }
  function salah(m, sasaran) {
    const e = $('ralat'); e.textContent = m; e.classList.remove('tersorok');
    const s = sasaran && $(sasaran);
    (s || e).scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (s && s.focus && s.tagName === 'INPUT') setTimeout(() => s.focus(), 350);
    toast(m);
  }
  async function hantar() {
    simpanMedan();
    if (!S.jenis) return salah(t('ePilihJenis'), 'secJenis');
    if (!S.mula || !S.tamat) return salah(t('ePilihTarikh'), 'secTarikh');
    if (S.f.nama.trim().length < 3) return salah(t('eNama'), 'fNama');
    if (S.f.telefon.replace(/\D/g, '').length < 10) return salah(t('eTel'), 'fTel');
    const btn = $('btnHantar');
    btn.disabled = true; btn.innerHTML = '<span class="pusing"></span>' + t('menghantar');
    try {
      S.data = await panggil('mohon', { k: KOD, jenis: S.jenis, tarikhMula: S.mula, tarikhTamat: S.tamat, nama: S.f.nama, telefon: S.f.telefon,
        email: S.f.email, pax: S.f.pax, catatan: S.f.catatan, website: S.f.web || '' });
      lukis(); window.scrollTo(0, 0);
    } catch (e) {
      btn.disabled = false; btn.textContent = t('hantarPendek');
      if (/taken|diambil/i.test(e.message)) {
        try { const baru = await panggil('link', { k: KOD }); S.sibuk = {}; baru.sibuk.forEach(k => { S.sibuk[k] = 1; }); if (!S.data.mula) { S.mula = ''; S.tamat = ''; } lukisKalendar(); kemaskini(); } catch (x) {}
        return salah(e.message, 'secTarikh');
      }
      salah(e.message);
    }
  }

  // ---------------- guest booking page ----------------
  function lukisStatus() {
    const d = S.data, r = d.request, b = d.booking, a = d.asas;
    const tarikh = b ? julat(b.mula, b.tamat) : julat(r.mula, r.tamat), jenis = (b || r).jenis;
    const baki = b ? Math.max(b.harga - b.dibayar, 0) : 0, sdPerlu = b && !/Returned|Kept/.test(b.statusSD) ? Math.max(b.sd - b.sdDibayar, 0) : 0;
    const depositPerlu = b && b.status === 'Hold' ? Math.max(b.deposit - b.dibayar, 0) : 0;
    const tahan = b && b.holdSehingga ? tHari(b.holdSehingga.split(' ')[0]) + ', ' + b.holdSehingga.split(' ')[1] : '';
    let st, nada = 'hijau';
    if (r.status === 'Ditolak') { st = t('stTolak'); nada = 'merah'; if (r.sebabTolak) st = [st[0], r.sebabTolak + '. ' + st[1]]; }
    else if (!b) { st = t('stBaru'); nada = 'biru'; }
    else if (b.status === 'Batal') { st = [t('stBatal')[0], b.sebabBatal]; nada = 'merah'; }
    else if (b.status === 'Luput') { st = t('stLuput'); nada = 'kelabu'; }
    else if (b.status === 'Hold') { st = b.buktiMenunggu ? t('stHoldBukti') : t('stHold', tahan); nada = 'kuning'; }
    else if (b.status === 'Selesai') st = t('stSelesai');
    else if (baki > 0) st = t('stSahBaki', rm(baki));
    else st = t('stSah', tHari(b.mula));

    const langkahSiap = [true, !!b && !['Batal', 'Luput'].includes(b.status), !!b && ['Confirmed', 'Selesai'].includes(b.status), !!b && ['Confirmed', 'Selesai'].includes(b.status) && baki <= 0, !!b && b.status === 'Selesai'];
    const kini = langkahSiap.indexOf(false);
    const gm = r.status === 'Ditolak' || (b && ['Batal', 'Luput'].includes(b.status)) ? '' :
      '<div class="kad"><div class="garis-masa">' + t('gm').map((x, i) => '<div class="' + (langkahSiap[i] ? 'siap' : i === kini ? 'kini' : 'belum') + '"><i>' + (langkahSiap[i] ? IKON.tanda : '') + '</i><span><b>' + x + '</b>' + (i === 4 && b ? '<small>' + tHari(b.mula) + '</small>' : '') + '</span></div>').join('') + '</div></div>';

    let bayar = '';
    if (b && !['Batal', 'Luput'].includes(b.status)) {
      const perlu = b.status === 'Hold' ? depositPerlu : baki + sdPerlu;
      bayar = '<div class="kad"><h3>' + t('bayaran') + '</h3>' +
        '<div class="rb"><span>' + t('sewa') + '</span><b>' + rm(b.harga) + '</b></div>' +
        '<div class="rb"><span>' + t('dibayar') + '</span><b>' + rm(b.dibayar) + '</b></div>' +
        '<div class="rb besar"><span>' + t('baki') + '<small>' + t('bakiSub') + '</small></span><b>' + rm(baki) + '</b></div>' +
        (b.sd ? '<div class="rb"><span>' + t('sd') + '<small>' + t('sdSub') + '</small></span><b>' + (/Returned|Kept/.test(b.statusSD) ? t('sdPulang') + ' ' + rm(b.sdDipulangkan) : rm(b.sd) + (b.sdDibayar >= b.sd ? ' ✓' : '')) + '</b></div>' : '') +
        (perlu > 0 && b.status !== 'Selesai' ? '<div class="bayar-kotak"><small style="font-weight:700;color:var(--kuning)">' + t('bayarSekarang') + (b.status === 'Hold' ? ' · ' + t('deposit') : '') + '</small><div class="amaun">' + rm(perlu) + '</div>' +
            (b.status !== 'Hold' && baki > 0 && sdPerlu > 0 ? '<small style="color:var(--kuning)">' + t('baki') + ' ' + rm(baki) + ' + ' + t('sd').toLowerCase() + ' ' + rm(sdPerlu) + '</small>' : '') +
            (a.bank ? '<small style="color:var(--kuning)">' + t('bayarKe') + '</small><div class="bank"><span>' + esc(a.bank) + '</span><button class="btn-kecil" onclick="salinBank()">' + t('salin') + '</button></div>' : '') + '</div>' +
          (b.buktiMenunggu ? '<div class="lencana">' + IKON.tanda + '<span>' + t('buktiTerima') + '</span></div>' : '') +
          '<button class="muat-naik" id="btnBukti" onclick="$(\'failBukti\').click()"><span class="ikon">' + IKON.kamera + '</span><span><b>' + t('muatNaik') + '</b><small>' + t('muatNaikSub') + '</small></span></button>'
        : baki <= 0 ? '<div class="lencana">' + IKON.tanda + '<span>' + t('lunas') + '</span></div>' : '') + '</div>';
    } else if (!b && r.status === 'Baru') {
      bayar = '<div class="kad"><div class="rb"><span>' + t('sewa') + '</span><b>' + rm(r.anggaran) + '</b></div></div>';
    }

    let dok = '';
    if (b) {
      const baris = (kod, tajuk, sub, jenis, id) => '<button class="dok" onclick="bukaDok(this, \'' + jenis + '\', \'' + (id || '') + '\')"><span class="pdf">' + kod + '</span><span class="isi"><b>' + tajuk + '</b><small>' + sub + '</small></span><span class="btn-kecil">' + t('buka') + '</span></button>';
      dok = '<div class="kad"><h3>' + t('dokumen') + '</h3>' +
        (b.status === 'Batal' ? baris('CN', t('notis'), esc(b.id), 'notice') :
          (b.status !== 'Luput' ? baris('INV', t('invois'), t('invoisSub'), 'invoice') : '') +
          (['Confirmed', 'Selesai'].includes(b.status) ? baris('BC', t('sah'), t('sahSub'), 'confirm') : '')) +
        b.bayaran.map(p => baris(p.jenis.indexOf('SD Dipulangkan') >= 0 ? 'SR' : p.jenis.indexOf('Refund') >= 0 ? 'RF' : 'RS', t('resit') + ' ' + esc(p.no), tHari(p.tarikh) + ' · ' + rm(p.jumlah), 'receipt', p.id)).join('') + '</div>';
    } else if (r.status === 'Baru') dok = '<div class="kad"><h3>' + t('dokumen') + '</h3><p class="sub" style="margin:0">' + t('dokSelepas') + '</p></div>';

    $('isi').innerHTML = '<div class="hero ' + nada + '"><small>' + t('hai', esc(r.nama)) + ' · ' + t('rujukan') + ' ' + esc(b ? b.id : r.id) + '</small><h2>' + esc(st[0]) + '</h2>' + (st[1] ? '<p>' + esc(st[1]) + '</p>' : '') + '</div>' +
      '<div class="kad"><h3>' + t('tempahan') + '</h3><div class="rb"><span>' + t('jenis') + '</span><b>' + t(jenis === 'Dewan' ? 'dewan' : 'homestay') + '</b></div>' +
        '<div class="rb"><span>' + t('tarikh') + '</span><b>' + tarikh + '</b></div><div class="rb"><span>' + t('tempoh') + '</span><b>' + t('unit', jenis, kiraUnit(jenis, (b || r).mula, (b || r).tamat)) + '</b></div></div>' +
      gm + bayar + dok +
      '<button class="btn btn-garis" style="margin-top:14px" onclick="segar(this)">' + t('segar') + '</button>';
    kaki(a.telefon ? '<div class="ringkas"><b>' + t('soalan') + '</b>' + esc(a.nama) + '</div><a class="btn btn-wa" style="width:auto" href="https://wa.me/' + a.telefon + '?text=' + encodeURIComponent((BH === 'ms' ? 'Hai, berkenaan tempahan ' : 'Hi, about booking ') + (b ? b.id : r.id) + '.') + '">' + IKON.wa + 'WhatsApp</a>' : '');
  }
  function salinBank() {
    const no = String(S.data.asas.bank).replace(/[^\d]/g, '') || S.data.asas.bank;
    (navigator.clipboard ? navigator.clipboard.writeText(no) : Promise.reject()).then(() => toast(t('disalin') + ': ' + no), () => toast(no));
  }
  async function segar(btn) {
    btn.disabled = true; btn.innerHTML = '<span class="pusing gelap"></span>';
    try { S.data = await panggil('link', { k: KOD }); } catch (e) { toast(e.message); }
    lukis();
  }
  function hantarBukti(el) {
    const f = el.files[0]; el.value = '';
    if (!f) return;
    const btn = $('btnBukti'); btn.disabled = true; btn.querySelector('b').textContent = t('memuatNaik');
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = async () => {
      const sk = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * sk); c.height = Math.round(img.height * sk);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      try { S.data = await panggil('bukti', { k: KOD, bukti: { data: c.toDataURL('image/jpeg', 0.78).split(',')[1], mimeType: 'image/jpeg' } }); lukis(); toast(t('buktiTerima')); }
      catch (e) { toast(e.message); btn.disabled = false; btn.querySelector('b').textContent = t('muatNaik'); }
    };
    img.onerror = () => { btn.disabled = false; btn.querySelector('b').textContent = t('muatNaik'); toast('Please choose a photo.'); };
    img.src = url;
  }
  async function bukaDok(el, jenis, id) {
    const label = el.querySelector('.btn-kecil'), asal = label.textContent;
    const w = window.open('', '_blank');
    label.textContent = t('menyedia'); el.disabled = true;
    try {
      const r = await panggil('dokumen', { k: KOD, jenis: jenis, id: id });
      if (w) w.location = r.url; else location.href = r.url;
    } catch (e) { if (w) w.close(); toast(e.message); }
    label.textContent = asal; el.disabled = false;
  }

  lukis();
  mula();
</script>
</body>
</html>
